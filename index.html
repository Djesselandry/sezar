<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<title>SEZAR</title>
<style>
  :root{
    --bg:#0b0f14; --card:#131a22; --line:#1f2a36; --txt:#e8eef5; --mut:#7d8b9a;
    --ok:#2ecc8f; --warn:#f5b942; --bad:#ff4d5e; --off:#5b6773;
  }
  *{box-sizing:border-box;margin:0}
  body{background:var(--bg);color:var(--txt);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
       min-height:100vh;padding:env(safe-area-inset-top) 16px 32px}
  main{max-width:520px;margin:0 auto;display:grid;gap:14px;padding-top:18px}
  header{display:flex;justify-content:space-between;align-items:center}
  .logo{font-weight:800;letter-spacing:.22em;font-size:15px}
  .logo small{display:block;font-weight:500;letter-spacing:.04em;color:var(--mut);font-size:11px;margin-top:2px}
  .pill{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:6px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--off)}
  .dot.on{background:var(--ok)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
  .status{--c:var(--off);text-align:center;padding:26px 16px;transition:background .3s,border-color .3s}
  .status .ico{width:64px;height:64px;margin:0 auto 12px;border-radius:50%;display:grid;place-items:center;
               background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c)}
  .status svg{width:30px;height:30px}
  .status h1{font-size:22px;letter-spacing:.04em;color:var(--c)}
  .status p{color:var(--mut);margin-top:4px;font-size:13px;min-height:18px}
  .status.ok{--c:var(--ok)} .status.warn{--c:var(--warn)}
  .status.bad{--c:var(--bad);border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--card))}
  .status.bad .ico{animation:pulse 1s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--bad) 60%,transparent)}100%{box-shadow:0 0 0 22px transparent}}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  button{font:inherit;font-weight:600;color:var(--txt);background:#1a2330;border:1px solid var(--line);
         border-radius:14px;padding:14px 10px;cursor:pointer;transition:.15s;-webkit-tap-highlight-color:transparent}
  button:active{transform:scale(.97)} button:disabled{opacity:.4}
  button.main{background:var(--ok);color:#06231a;border-color:transparent}
  button.stop{background:var(--bad);color:#fff;border-color:transparent}
  h2{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--mut);margin-bottom:10px;font-weight:600}
  .row{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
  .row:first-of-type{border-top:0}
  .row img{width:84px;height:63px;object-fit:cover;border-radius:8px;background:#000;cursor:pointer}
  .row b{display:block;font-weight:600}.row span{color:var(--mut);font-size:13px}
  .empty{color:var(--mut);text-align:center;padding:14px 0}
  .info{display:flex;justify-content:space-between;color:var(--mut);font-size:13px}
  .info b{color:var(--txt);font-weight:600}
  .link{background:none;border:0;color:var(--mut);font-size:12px;padding:6px;text-decoration:underline}
  #login{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;padding:24px;z-index:9}
  #login form{width:100%;max-width:340px;display:grid;gap:12px;text-align:center}
  input{font:inherit;color:var(--txt);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center}
  #lb{position:fixed;inset:0;background:#000d;display:none;place-items:center;z-index:8}
  #lb img{max-width:96vw;max-height:90vh;border-radius:10px}
  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1a2330;border:1px solid var(--line);
         padding:10px 16px;border-radius:12px;font-size:13px;opacity:0;transition:.25s;pointer-events:none}
  #toast.show{opacity:1}
</style>
</head>
<body>

<div id="login" hidden><form onsubmit="return connecter(event)">
  <div class="logo" style="font-size:20px">SEZAR<small>Zone d'alerte résidentielle</small></div>
  <input id="email" type="email" placeholder="E-mail" autocomplete="username" required>
  <input id="mdp" type="password" placeholder="Mot de passe" autocomplete="current-password" required>
  <button class="main">Se connecter</button>
  <p id="lerr" style="color:var(--bad);font-size:13px"></p>
</form></div>
<div id="lb" onclick="this.style.display='none'"><img id="lbimg" alt=""></div>

<main>
  <header>
    <div class="logo">SEZAR<small>Surveillance depuis le cloud</small></div>
    <div class="pill"><span class="dot" id="dPc"></span>PC <span class="dot" id="dEsp" style="margin-left:6px"></span>ESP32 <span class="dot" id="dCam" style="margin-left:6px"></span>Caméra</div>
  </header>

  <section class="card status" id="status">
    <div class="ico" id="ico"></div>
    <h1 id="titre">Connexion…</h1>
    <p id="sous"></p>
  </section>

  <section class="grid">
    <button class="main" id="bArm" onclick="agir('arm')">Armer</button>
    <button id="bDesarm" onclick="agir('desarm')">Désarmer</button>
    <button class="stop" id="bStop" onclick="agir('veille')">Couper la sirène</button>
    <button id="bTest" onclick="agir('alerte')">Tester l'alarme</button>
  </section>

  <section class="card">
    <h2>Journal des intrusions</h2>
    <div id="journal"><div class="empty">Aucune intrusion enregistrée</div></div>
  </section>

  <section class="card">
    <div class="info"><span>Alertes depuis le démarrage</span><b id="nb">–</b></div>
    <div class="info" style="margin-top:6px"><span>Dernière synchronisation</span><b id="maj">–</b></div>
    <div style="text-align:center;margin-top:8px"><button class="link" onclick="sortir()">Se déconnecter</button></div>
  </section>
</main>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
const ICONS = {
  ok:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.5-3.2 7.8-8 9-4.8-1.2-8-4.5-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg>',
  warn:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.5-3.2 7.8-8 9-4.8-1.2-8-4.5-8-9V6z"/><path d="M9 9l6 6M15 9l-6 6"/></svg>',
  bad:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9.5 17h-19z"/><path d="M12 10v4M12 17.5v.01"/></svg>',
  off:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 8.5a15 15 0 0 1 20 0M5 12a10 10 0 0 1 14 0M8.5 15.5a5 5 0 0 1 7 0M12 19v.01"/><path d="M3 3l18 18"/></svg>'
};
const $ = id => document.getElementById(id);
const toast = t => { const e=$('toast'); e.textContent=t; e.classList.add('show'); setTimeout(()=>e.classList.remove('show'),2200); };

if (!window.supabase || !window.SEZAR || window.SEZAR.URL.includes('VOTRE')) {
  $('login').hidden = false;
  $('lerr').textContent = "Configuration manquante : remplis config.js (URL et clé anon Supabase).";
}
const sb = (window.supabase && window.SEZAR) ? window.supabase.createClient(SEZAR.URL, SEZAR.ANON) : null;
let timer = null;

async function demarrer(){
  const { data } = await sb.auth.getSession();
  if (data.session){ $('login').hidden = true; maj(); timer = setInterval(maj, 2000); }
  else $('login').hidden = false;
}
async function connecter(e){
  e.preventDefault();
  const { error } = await sb.auth.signInWithPassword({ email: $('email').value, password: $('mdp').value });
  if (error){ $('lerr').textContent = "Erreur : " + error.message; return false; }
  $('lerr').textContent = ''; demarrer(); return false;
}
async function sortir(){ await sb.auth.signOut(); clearInterval(timer); location.reload(); }

function afficher(cls, titre, sous){
  $('status').className = 'card status ' + cls;
  $('ico').innerHTML = ICONS[cls] || ICONS.off;
  $('titre').textContent = titre; $('sous').textContent = sous || '';
}

async function maj(){
  const [{ data: e, error: err }, { data: j }] = await Promise.all([
    sb.from('etat').select('*').eq('id', 1).maybeSingle(),
    sb.from('alertes').select('*').order('heure', { ascending: false }).limit(20)
  ]);
  if (err){ afficher('off', 'Cloud injoignable', 'Vérifie ta connexion Internet'); return; }
  if (!e || !e.maj){ afficher('off', 'En attente du PC', 'Lance le serveur SEZAR sur le PC'); return; }

  const age = (Date.now() - new Date(e.maj).getTime()) / 1000;
  const pcOk = age < 20;
  $('dPc').className = 'dot' + (pcOk ? ' on' : '');
  $('dEsp').className = 'dot' + (pcOk && e.esp_ok ? ' on' : '');
  $('dCam').className = 'dot' + (pcOk && e.camera_ok ? ' on' : '');
  $('maj').textContent = pcOk ? 'il y a ' + Math.round(age) + ' s' : 'il y a ' + Math.round(age/60) + ' min';
  $('nb').textContent = e.nb_alertes ?? '–';

  if (!pcOk) afficher('off', 'PC hors ligne', 'Le serveur SEZAR ne répond plus');
  else if (!e.esp_ok) afficher('off', 'ESP32 hors ligne', 'Vérifie son alimentation et le Wi-Fi');
  else if (e.alerte) afficher('bad', 'INTRUSION', 'Source : ' + e.source);
  else if (e.armee) afficher('ok', 'Système armé', 'Surveillance active');
  else afficher('warn', 'Système désarmé', 'Les mouvements sont ignorés');

  const live = pcOk && e.esp_ok;
  $('bStop').disabled = !(live && e.alerte);
  $('bArm').disabled = !live || e.armee;
  $('bDesarm').disabled = !live || !e.armee;
  $('bTest').disabled = !live;

  $('journal').innerHTML = (j && j.length)
    ? j.map(x => `<div class="row"><img src="${x.photo_url}" loading="lazy" onclick="agrandir('${x.photo_url}')" alt="">
        <div><b>Intrusion détectée</b><span>${new Date(x.heure).toLocaleString('fr-FR')}</span></div></div>`).join('')
    : '<div class="empty">Aucune intrusion enregistrée</div>';
}
function agrandir(u){ $('lbimg').src = u; $('lb').style.display = 'grid'; }

async function agir(action){
  const { error } = await sb.from('commandes').insert({ action });
  if (error){ toast('Envoi impossible'); return; }
  toast('Ordre envoyé…');
  setTimeout(maj, 3000);
}

if (sb) demarrer();
</script>
</body>
</html>
