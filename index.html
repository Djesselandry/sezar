<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#231712">
  <title>SEZAR</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="login" hidden>
    <form id="loginForm" autocomplete="on" class="login-card">
      <div class="brand-block">
        <span class="brand-name">SEZAR</span>
        <span class="brand-sub" id="loginSub">Connexion au système</span>
      </div>

      <div id="loginCloudFields">
        <label class="field-label" for="email">E-mail</label>
        <input id="email" type="email" autocomplete="username" required>
        <label class="field-label" for="mdp">Mot de passe</label>
        <input id="mdp" type="password" autocomplete="current-password" required>
      </div>

      <div id="loginLocalFields" hidden>
        <label class="field-label" for="cle">Clé d'accès</label>
        <input id="cle" type="password" autocomplete="off" placeholder="Clé locale">
      </div>

      <button type="submit" class="btn btn-primary btn-block" id="loginSubmit">Se connecter</button>
      <p id="loginErreur" class="form-error" role="alert"></p>
    </form>
  </div>

  <main class="page">
    <header class="topbar">
      <div class="welcome-block">
        <span class="eyebrow">Bonjour, Landry</span>
        <strong>Bon retour</strong>
      </div>
      <button type="button" class="notif" aria-label="Notifications">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 17h5l-1.4-1.4A2 2 0 0 1 18 14.2V11a6 6 0 1 0-12 0v3.2a2 2 0 0 1-.6 1.4L4 17h5"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>
      </button>
    </header>

    <nav class="filters" aria-label="Filtres">
      <button type="button" class="filter-chip is-active" data-filter="all">Tout</button>
      <button type="button" class="filter-chip" data-filter="alerts">Alertes</button>
      <button type="button" class="filter-chip" data-filter="devices">Appareils</button>
    </nav>

    <section class="panel status-panel">
      <div class="status-card" id="etatCard">
        <div class="status-ic" id="etatIcon" aria-hidden="true"></div>
        <div class="status-copy">
          <h1 id="etatTitre">Chargement</h1>
          <p id="etatDetails">Connexion au système…</p>
        </div>
      </div>
    </section>

    <section class="panel scenes-panel" aria-labelledby="scenesTitre">
      <div class="panel-head">
        <h2 id="scenesTitre">Scènes</h2>
      </div>
      <div class="scenes-grid" id="sceneGrid"></div>
    </section>

    <section class="panel devices-panel" aria-labelledby="devicesTitre">
      <div class="panel-head">
        <h2 id="devicesTitre">Appareils</h2>
      </div>
      <div id="deviceList" class="device-list"></div>
    </section>

    <section class="panel live-panel" aria-labelledby="liveTitre">
      <div class="live-header">
        <span class="live-badge">EN DIRECT</span>
        <button type="button" class="ghost-button" id="btnFullscreen">Plein écran</button>
      </div>
      <div class="live-frame">
        <img id="liveImg" alt="Vue en direct de la caméra">
      </div>
      <div class="live-status" id="liveStatus">Caméra hors ligne</div>
    </section>

    <section class="panel journal-panel" aria-labelledby="journalTitre">
      <div class="panel-head">
        <h2 id="journalTitre">Journal des intrusions</h2>
      </div>
      <div id="journalListe" class="journal-list"></div>
    </section>

    <div class="assistant-wrapper">
      <button type="button" class="assistant-toggle" id="assistantToggle" aria-label="Assistant SEZAR">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 15V8a6 6 0 0 1 12 0v7"/><path d="M8 18h8a2 2 0 0 1-2 2h-4a2 2 0 0 1-2-2z"/><path d="M9 12h6"/></svg>
      </button>
      <aside id="assistantPanel" class="assistant-panel" hidden>
        <div class="assistant-header">
          <strong>Assistant local</strong>
          <button type="button" class="mini-close" id="assistantClose">×</button>
        </div>
        <div id="assistantMessages" class="assistant-messages" aria-live="polite"></div>
        <div class="assistant-suggestions" id="assistantSuggestions"></div>
        <div class="assistant-input-row">
          <input id="assistantInput" type="text" maxlength="300" placeholder="Demander l'état…">
          <button type="button" id="assistantSend">Envoyer</button>
        </div>
      </aside>
    </div>
  </main>

  <div id="lightbox" class="lightbox" hidden>
    <button type="button" class="lightbox-close" id="lightboxClose">Fermer</button>
    <img id="lightboxImg" class="lightbox-img" alt="Photo de l'intrusion">
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
